{
  "type": "markdown",
  "title": "🛍️ Mercado Libre",
  "entity_id": [
    "sensor.mercado_libre_envios_en_seguimiento"
  ],
  "content": "{% set entity = 'sensor.mercado_libre_envios_en_seguimiento' %}\n{% set labels = {'pending': '⏳ Pendiente', 'handling': '🛠️ En preparación', 'ready_to_ship': '📦 Listo para despacho', 'shipped': '🚚 En camino', 'delivered': '✅ Entregado', 'cancelled': '🚫 Cancelado', 'not_delivered': '⚠️ No entregado'} %}\n{% set shipments = state_attr(entity, 'shipments') or [] %}\n{% set terminal = ['delivered', 'cancelled', 'not_delivered'] %}\n{% if states(entity) == 'unavailable' %}\n**🔌 Conexión no disponible.** Home Assistant volverá a consultar según su programación. Revisa la integración si solicita autorización.\n{% elif states(entity) == 'unknown' and not shipments %}\n**⏳ Esperando datos de Mercado Libre.**\n{% else %}\n{% if states(entity) not in ['unknown', 'unavailable'] %}\n## 📦 {{ states(entity) }} {{ 'paquete' if states(entity) == '1' else 'paquetes' }} en seguimiento\n{% else %}\n## 🔎 Seguimiento parcial\n{% endif %}\n{% if state_attr(entity, 'truncated') %}\nConsulta limitada a {{ state_attr(entity, 'orders_checked') }} de {{ state_attr(entity, 'orders_total') }} compras. No se muestra un total exacto de paquetes activos.\n{% endif %}\n{% if state_attr(entity, 'unknown_shipments') %}\nHay {{ state_attr(entity, 'unknown_shipments') }} envíos con estado aún no reconocido.\n{% endif %}\n{% set active = shipments | rejectattr('status', 'in', terminal) | list %}\n{% if not active %}\n✨ No hay paquetes activos entre los envíos consultados.\n{% endif %}\n{% for shipment in active[:8] %}\n### {{ labels.get(shipment.status, shipment.status) | e }}\n{% for product in shipment.products %}\n- {{ (product.name or 'Producto') | e }}{% if product.quantity %} · {{ product.quantity }} un.{% endif %}\n{% endfor %}\n{% if shipment.tracking_number %}🔎 Seguimiento: **{{ shipment.tracking_number | e }}**{% endif %}\n{% if shipment.substatus %}{{ '🏷️ Etiqueta de envío creada' if shipment.substatus == 'printed' else shipment.substatus | replace('_', ' ') | e }}{% endif %}\n{% set timing = namespace(last=none) %}\n{% for event in shipment.history %}\n{% set event_time = as_timestamp(event.date, none) %}\n{% if event_time is not none and event_time <= as_timestamp(now()) and (timing.last is none or event_time > timing.last) %}\n{% set timing.last = event_time %}\n{% endif %}\n{% endfor %}\n{% if timing.last is not none %}\n{% set idle_days = (now().date() - as_local(as_datetime(timing.last)).date()).days %}\n⏱️ **Último evento fechado:** {{ 'hoy' if idle_days == 0 else 'hace ' ~ idle_days ~ (' día' if idle_days == 1 else ' días') }}\n{% if idle_days >= 7 %}\n⏳ Revisar espera · 7 días o más sin nuevos eventos fechados.\n{% endif %}\n{% endif %}\n**🕒 Historial del envío**\n{% for event in shipment.history[-6:] %}\n{% set when = as_timestamp(event.date, none) %}\n- {% if when is not none %}{{ when | timestamp_custom('%d/%m %H:%M', true) }} · {% endif %}{{ labels.get(event.status, event.status) | e }}\n{% endfor %}\n---\n{% endfor %}\n{% if active | count > 8 %}Se muestran 8 de {{ active | count }} envíos activos o pendientes de clasificación.{% endif %}\n{% set completed = shipments | selectattr('status', 'in', terminal) | list %}\n{% if completed %}\n<details><summary>📬 Últimos envíos finalizados</summary>\n\n{% for shipment in completed[:4] %}\n**{{ labels.get(shipment.status, shipment.status) | e }}**\n{% for product in shipment.products %}\n- {{ (product.name or 'Producto') | e }}\n{% endfor %}\n{% if shipment.history %}\n{% set last = shipment.history[-1] %}\n{% set when = as_timestamp(last.date, none) %}\n🕒 Último evento: {% if when is not none %}{{ when | timestamp_custom('%d/%m %H:%M', true) }} · {% endif %}{{ labels.get(last.status, last.status) | e }}\n{% endif %}\n\n{% endfor %}\n</details>\n{% endif %}\n{% if state_attr(entity, 'orders_without_shipment') %}\n{{ state_attr(entity, 'orders_without_shipment') }} compras no tienen un envío asociado en la respuesta de la API.\n{% endif %}\n{% endif %}\n",
  "grid_options": {
    "columns": "full",
    "rows": "auto"
  }
}
